    relationship: "supersedes"
    note: >-
      An earlier version of this formalization (release v1.0.1 of the same
      repository) proved only the combinatorial core and derived Theorem A
      from two explicit hypotheses: the Alexandrov–Urysohn theorem and the
      geometric identification of D(X) with the code space. Both are proved
      here, and the files of that version (Tree, CodeSpace, Topology,
      GdeltaPolish, TheoremA) are reused unchanged apart from the module
      system.

status:
  scope: >-
    The Challenge theorem RegSub.theoremA_l2 is the complete Theorem A of the
    paper for a continuum in ℓ², with D(X) homeomorphic both to ℕ → ℕ and to
    the irrationals. Formalized: the template continuum and the facts on
    indecomposable continua and composants that the proof uses; the
    construction in ℓ² and Lemmas 3.1–3.3 and 3.5(a),(c); Lemmas 4.2–4.5 and
    both directions of Theorem 4.6; Lemma 5.1 and Propositions 5.2 and 5.3;
    Proposition 5.4 in the code-space form that suffices for Theorem A;
    the direction of Fact 2.5(a) used; the Alexandrov–Urysohn theorem; and
    ℕ^ℕ homeomorphic to the irrationals. Not formalized, because Theorem A does
    not use them: Example 2.6, Lemma 3.5(b), the branch-limit statement in
    Lemma 3.3(h), the geometric form of Proposition 5.4 (the non-regular limit
    continua A*), Remarks 4.7 and 5.5–5.7, and Section 6 on the rational case,
    which remains open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "RegSub.theoremA_l2"
    - "RegSub.alexandrovUrysohn"
    - "RegSub.baire_homeomorph_irr"
    - "RegSub.PhiHomeo"

