version: "v0.4"

project:
  name: "A continuum whose hyperspace of regular subcontinua is homeomorphic to the irrationals"
  description: >-
    For a metric continuum X, a subcontinuum is regular if it equals the
    closure of its interior, and D(X) denotes the hyperspace of regular
    subcontinua with the Hausdorff metric. Camargo, Ordoñez and Ramírez asked
    whether D(X) can be homeomorphic to the rationals or to the irrationals.
    This project formalizes in Lean 4 with Mathlib the complete proof of the
    affirmative answer for the irrationals: there is a nondegenerate compact
    connected set X in the Hilbert space ℓ² such that D(X) is homeomorphic to
    the Baire space ℕ^ℕ and to the space of irrational numbers. The continuum
    X is the closure of a countable tree of scaled copies of the Knaster
    continuum, realized in ℓ² as the inverse limit of the tent map. The
    formalization proves that the regular subcontinua of X are coded exactly by
    the nonempty, convex sets of pieces that satisfy a density condition. It
    shows that this coding is a homeomorphism onto a nonempty,
    zero-dimensional G_δ subset of a Cantor cube in which every compact set has
    empty interior. It then concludes with the Alexandrov–Urysohn
    characterization of the Baire space and the homeomorphism between ℕ^ℕ and
    the irrationals. Both classical results are also proved in the project.
  authors:
    - "Lucas Alves de Almeida"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lucas Alves de Almeida"

