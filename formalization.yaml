        compiling with Lean 4.35.0 and Mathlib, and ran the checks itself:
        CheckAxioms.lean, SanityChecks.lean, leanchecker, lean4export with
        nanoda, and lake comparator with the Lean kernel, nanoda and con-ron.
        The same agent also drafted the paper's construction and proofs with
        the author, as the paper's AI disclosure states.
      cost:
        wall_time: "not tracked precisely; several agent sessions"
        spend_usd: "subscription-based"
        hardware: "cloud workspace; model accessed through Anthropic's service"
      prompting_notes: >-
        The author set the research problem and plan, then asked for a full
        Lean formalization including the known results it uses, followed by a
        recheck, compilation and review. The first prompt of the project is
        kept unedited in prompt/first-prompt.md on the main branch of the
        repository.
  spend_usd: "subscription-based"
  notes: >-
    The human author chose the problem, supplied the literature, directed the
    work and reviewed the outputs at each stage; he did not write the Lean
    code. Claude Opus 5.5 proposed the construction, wrote the proofs in the
    paper and produced the whole formalization. ChatGPT-Astra (OpenAI) was used
    with the author to check successive versions of the manuscript, not the
    Lean code.

fidelity:
  divergences: >-
    Differences of presentation from the paper, none changing the
    mathematics: (1) the template continuum is the inverse limit of the tent
    map t ↦ min(2t, 2 − 2t) on [0,1], a standard model of the Knaster
    continuum, instead of the planar bucket-handle picture; (2) each piece
    receives its own infinite block of coordinates of ℓ² instead of a plane,
    and the template is embedded by z ↦ (2^{-(n+1)} z_n); (3) the root offset
    is the template point ρ instead of (0,0); (4) indices start at 0; (5)
    "distinct composants" is formalized as "not in a common proper
    subcontinuum", and the template points of Lemma 3.1 are obtained from the
    Baire category theorem; (6) the density condition (c) of Theorem 4.6 is
    encoded with a countable base, with a proof that the encoding is
    equivalent; (7) Proposition 5.4 is proved in the code space and
    transferred through the homeomorphism of Proposition 5.2. The Challenge
    adds X.Nontrivial, which the conclusion implies anyway.

review:
  status: "self-assessed"
  notes: >-
    No independent human or expert review of the paper or of the Lean
    statement has been performed. The producing agent audited the statement
    against the paper (SanityChecks.lean checks the definitions on examples,
    including that the topology on NonemptyCompacts is the Hausdorff-metric
    topology and that the template continuum is indecomposable) and carried out
    a line-by-line review of the paper, recorded in REVIEW_AND_VERIFICATION.md
    on the main branch. Mechanical checks: build with no errors or warnings;
    only the axioms propext, Classical.choice and Quot.sound; leanchecker
    replay of every module; nanoda on Theorem A with all 23,932 dependencies;
    lake comparator accepted by the Lean kernel, nanoda and con-ron.

alignment:
  namespace: "RegSub"
  statements:
    - source: "Theorem A"
      lean: "RegSub.theoremA_l2"
      module: "RegSub.Main"
      status: "proved"
      note: "The Challenge statement; also states nondegeneracy of X and both homeomorphisms."
    - source: "Definition of D(X) (Section 1)"
      lean: "RegSub.regularSubcontinua"
      module: "RegSub.TheoremA"
      status: "proved"
      note: "Definition used in the Challenge, identical in Challenge.lean."
    - source: "Theorem 4.6"
      lean: "RegSub.pcs_admissible"
      module: "RegSub.Theorem46"
      status: "proved"
      note: "Necessity; sufficiency is RegSub.reg_Psi with RegSub.pcs_Psi and RegSub.Psi_pcs."
    - source: "Proposition 5.2"
      lean: "RegSub.PhiHomeo"
      module: "RegSub.Identification"
      status: "proved"
      note: "D(X) is homeomorphic to the code space."
    - source: "Proposition 5.4"
      lean: "RegSub.isCompact_interior_eq_empty"
      module: "RegSub.Topology"
      status: "adapted"
      note: "Proved in the code space; transferred to D(X) through RegSub.PhiHomeo."
    - source: "Fact 2.5(b), Kechris Theorem 7.7 (Alexandrov–Urysohn)"
      lean: "RegSub.alexandrovUrysohn"
      module: "RegSub.AlexandrovUrysohn"
      status: "proved"
      note: "Proved with a Lusin scheme."
    - source: "Fact 2.5(c)"
      lean: "RegSub.baire_homeomorph_irr"
      module: "RegSub.Irrational"
      status: "proved"
      note: "ℕ → ℕ is homeomorphic to the irrationals."

